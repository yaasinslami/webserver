<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload File</title>
    <style>
        body { font-family: sans-serif; background: #eee; text-align: center; padding: 50px; }
        .card { background: white; padding: 40px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; border: 1px dashed #ccc; padding: 20px; width: 80%; background: #fafafa; }
        button { background: #0984e3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #74b9ff; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Upload an Image</h1>
        
        <form action="/cgi-bin/upload.py" method="POST" enctype="multipart/form-data">
            <input type="text" name="username" placeholder="Your Name" required>
            <input type="file" name="file" required> <br>
            <button type="submit">Upload File</button>
        </form>
        
    </div>

</body>
</html>
