<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 Forbidden</title>
    <style>
        body { background-color: #1a1a1a; color: #f1f1f1; font-family: 'Courier New', Courier, monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; border: 2px solid #e74c3c; padding: 40px; border-radius: 8px; box-shadow: 0 0 20px rgba(231, 76, 60, 0.2); max-width: 500px; }
        h1 { font-size: 6rem; margin: 0; color: #e74c3c; text-shadow: 4px 4px 0px #000; }
        h2 { font-size: 2rem; margin-top: 10px; border-bottom: 1px solid #555; padding-bottom: 10px; }
        p { color: #aaa; margin-top: 20px; font-size: 1.1rem; }
        .lock-icon { font-size: 3rem; margin-bottom: 10px; display: block; }
        .btn { display: inline-block; margin-top: 30px; padding: 10px 20px; background: #e74c3c; color: #fff; text-decoration: none; font-weight: bold; border-radius: 4px; transition: background 0.3s; }
        .btn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <span class="lock-icon">🔒</span>
        <h1>403</h1>
        <h2>Access Denied</h2>
        <p>You do not have permission to access this resource. If you believe this is an error, contact the server administrator.</p>
        <a href="/" class="btn">Go Back</a>
    </div>
</body>
</html>
