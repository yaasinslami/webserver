<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload File</title>
    <style>
        body { font-family: sans-serif; background: #eee; text-align: center; padding: 50px; }
        form { background: white; padding: 30px; display: inline-block; border-radius: 10px; }
        input { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>File Upload Test</h1>
    
    <form action="/upload" method="POST" enctype="application/x-www-form-urlencoded">
        <label>Enter Text to Save:</label><br>
        <textarea name="content" rows="10" cols="30">Hello World!</textarea><br>
        <button type="submit">Upload Text</button>
    </form>
    
    <br>
    <a href="/">Back Home</a>
</body>
</html>
