<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { background: #0f172a; color: white; font-family: 'JetBrains Mono', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 2rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); width: 350px; }
        input { w-full; background: #1e293b; border: 1px solid #334155; color: white; padding: 0.8rem; margin: 10px 0; border-radius: 0.5rem; width: 90%; }
        button { width: 100%; padding: 0.8rem; background: #3b82f6; border: none; border-radius: 0.5rem; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Welcome Back</h2>
        <form action="/cgi-bin/auth.py" method="POST">
            <input type="text" name="user" placeholder="Username" required>
            <input type="password" name="pass" placeholder="Password" required>
            <button type="submit">Unlock Inbox</button>
        </form>
    </div>
</body>
</html>
