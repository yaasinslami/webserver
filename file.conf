
# http block: Holds global settings that apply to all servers
# (unless overridden inside a server block).
http {
    # Requirement: "Set up default error pages."
    error_page 404 /var/www/errors/404.html;
    error_page 500 /var/www/errors/500.html;

    # Requirement: "Set the maximum allowed size for client request bodies."
    client_max_body_size 10m; # 10 megabytes

    
    # --- SERVER 1: Main Website (www.site-one.com) ---
    # Requirement: "defining multiple websites served by your program"
    
    server {
        # Requirement: "Define all the interface:port pairs"
        listen 8080;
        
        # Requirement: "server name... for virtual hosts"
        server_name www.site-one.com site-one.com;

        # Default root for this server
        root /var/www/site1;

        # Requirement: "Default file to serve when... a directory"
        index index.html;

        # Override the global 404 page just for this server
        error_page 404 /var/www/site1/custom_404.html;

        # Requirement: "Execution of CGI, based on file extension"
        # This is a custom directive mapping extensions to interpreters.
        cgi_pass .py /usr/bin/python3;
        cgi_pass .php /usr/bin/php-cgi;

        # --- Location Blocks for Server 1 ---

        # Location 1: The root path "/"
        location / {
            # Requirement: "List of accepted HTTP methods"
            limit_except GET; # Only allow GET
            
            # Requirement: "Enabling or disabling directory listing"
            autoindex off;
        }

        # Location 2: A path for CGI scripts
        location /cgi-bin/ {
            # Allow both GET (for query strings) and POST (for forms)
            limit_except GET POST;
            
            # This is important for CGIs to find relative files
            root /var/www/cgi-scripts;
        }

        # Location 3: A path for file uploads
        location /upload/ {
            # Requirement: "Uploading files... is authorized"
            limit_except POST; # Only allow POST for uploads

            # Requirement: "storage location is provided"
            # This is our custom directive for the project
            upload_path /tmp/www/uploads;

            # We can also override client_max_body_size for this location
            client_max_body_size 50m; # Allow 50MB uploads here
        }

        # Location 4: A path with directory listing enabled
        location /public/ {
            # Requirement: "Enabling or disabling directory listing"
            autoindex on;
            
            limit_except GET;
        }

        # Location 5: An old path that needs to be redirected
        location /old-page.html {
            # Requirement: "HTTP redirection."
            return 301 http://www.site-one.com/new-page.html;
        }
    }


    # --- SERVER 2: A simple API (api.server.com) ---
    
    server {
        listen 8081;
        server_name api.server.com;
        
        # Requirement: "Directory where the requested file should be located"
        # This server has a different root directory.
        root /var/www/api;
        
        # This server's default file is a script
        index index.py;
        
        # This server only handles one CGI type
        cgi_pass .py /usr/bin/python3;

        # This entire server is just for CGI
        location / {
            limit_except GET POST;
            autoindex off;
            # Note: The server logic will see index.py,
            # match it with cgi_pass, and execute it.
        }
    }

    # --- SERVER 3: A default server for un-matched hosts ---
    
    server {
        listen 80; # The default HTTP port
        
        # No server_name means this is the default for any
        # request to port 80 that doesn't match another server.
        
        root /var/www/default;
        index index.html;
        
        # This server just returns an error for everything.
        location / {
            limit_except GET;
            return 403; # 403 Forbidden
        }
    }
}
