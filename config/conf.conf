server {
    listen 0.0.0.0:8080;
    server_name www2.local;
    root ./www2/;

    location / {
        allowed_methods GET;
        index login.html;
    }

    location /assets {
        allowed_methods GET;
    }

    location /cgi-bin {
        allowed_methods GET POST;
        cgi_pass .py /usr/bin/python3;
    }

    location /inbox {
        allowed_methods GET;
        cgi_pass .py /usr/bin/python3;
    }

    location /users {
        allowed_methods GET;
    }
}