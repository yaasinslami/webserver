# Config with an http block
http {
    # These are HTTP-level defaults
    root /var/www/default;
    index default.html;
    error_page 500 /500.html;

    server {
        listen 8080;
        server_name localhost;
        
        # This root overrides the http-level default
        root /var/www/html; 

        location / {
            index index.html; # This index is specific to this location
        }
    }

    server {
        listen 8001;
        server_name api.example.com;
        
        # This server uses the http-level root (/var/www/default)
        # and the http-level error_page
        
        location /api {
            allowed_methods POST;
        }
    }
}
