server {
    listen 8080;
    server_name localhost;
    root /var/www/html;

    # Define a custom error page
    error_page 404 /error_pages/404.html;

    # This is the main location
    location / {
        allowed_methods GET;
        index index.html index.htm;
    }

    # A second location for handling uploads
    location /uploads {
        allowed_methods POST;
        root /var/www/uploads;
        autoindex on;
    }
}
