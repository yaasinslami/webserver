# This http block can hold global settings
http {
    # Default error page for all servers (can be overridden)
    error_page 404 /errors/404.html;
    
    # Default max upload size for all servers
    client_max_body_size 10m;

    # Server 1: The main website
    server {
        # Listen on port 8080 for any IP
        listen 8080;
        
        # This server responds to these host names
        server_name www.site-one.com site-one.com;
        
        # Root directory for all files on this server
        root /var/www/site1;
        
        # Default files to look for in a directory
        index index.html index.htm;

        # --- Location Blocks for Routing ---

        # Handle requests for the root path "/"
        location / {
            limit_except GET; # Only allow GET method
            autoindex off;
        }

        # Handle requests for /cgi-bin/
        # This will execute CGI scripts
        location /cgi-bin/ {
            # Allow GET (for query strings) and POST (for forms)
            limit_except GET POST;
            
            # CGI scripts might be in a different root
            root /var/www/cgi-scripts;
            
            # Tell the server to use this python interpreter
            # (Your server will need to know how to handle this)
            cgi_pass /usr/bin/python3;
        }

        # Handle directory for file listings
        location /public/ {
            limit_except GET;
            autoindex on; # Show a directory listing
        }

        # Handle file uploads
        location /upload/ {
            limit_except POST; # Only allow POST
            
            # Override the global max size for this location
            client_max_body_size 50m;
        }
        
        # Handle a redirect
        location /old-page.html {
            # 301 = Permanent Redirect
            return 301 http://www.site-one.com/new-page.html;
        }
    }

    # Server 2: A simple API or a second site
    server {
        # Listen on a different port
        listen 8081;
        
        server_name api.myserver.com;
        root /var/www/api;
        index index.py;

        # Override the error page just for this server
        error_page 404 /api_404.html;

        # This entire server only allows POST
        location / {
            limit_except POST;
            cgi_pass /usr/bin/python3;
        }
    }
}
