root www;
error_page 400 /error_pages/400.html;
error_page 404 /error_pages/404.html;
error_page 403 /error_pages/403.html;

server {
	listen localhost;
	server_name site1;

	error_page 500 /error_pages/500.html;

	location / {
		index file.txt index.html;
		autoindex on;
		allowed_methods GET POST DELETE;
	}

	location /upload {
		allowed_methods GET POST;
		upload_loc /uploads;
	}
}

server {
	listen localhost;
	server_name localhost;

	error_page 500 /error_pages/500.html;

	location / {
		index file.txt index.html;
		autoindex on;
		allowed_methods GET POST DELETE;
	}

	location /upload {
		allowed_methods GET POST;
		upload_loc /uploads;
	}
}

server {
	listen 0.0.0.0:8080;
	server_name  127.0.0.5;
	server_name  127.0.0.1;

	
	location /bsp/images {
		alias /var/www/html/;
		allowed_methods POST;
	}

	location /images/zen {
		alias /var/www/html/;
		allowed_methods POST;
	}
}
