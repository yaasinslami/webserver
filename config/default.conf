root www;
error_pages 500 /500.html;

server {
	listen localhost:8080;
	server_name localhost;

	location / {
		# alias /www/html;
		index index.html file.txt;
		autoindex on;
		allowed_methods GET POST DELETE;
	}
}

server {
	listen 127.0.0.1:8001;
	server_name  127.0.0.5;
	server_name  127.0.0.1;

	
	location /bsp/images {
		alias /var/www/html/;
		allowed_methods POST;
	}

	location /images/zen {
		alias /var/www/html/;
		allowed_methods POST;
	}
}
