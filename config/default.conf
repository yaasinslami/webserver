server {
	listen 0.0.0.0:8080;
	server_name webserv_main;
	root ./www/;

	error_page 404 /404.html;
	client_max_body_size 10M;
	# index index.html;

	location / {
		autoindex on;
	}

	location /old_site {
		allowed_methods GET;
		root /legacy;
	}

	location /uploads {
		allowed_methods GET POST DELETE;
		upload on;
		upload_loc /uploads;
	}

	location /protected {
		allowed_methods GET;
	}

	location /cgi-bin {
		allowed_methods GET POST;
		cgi_pass .py /usr/bin/python3;
		upload on;
		upload_loc ../../../uploads;
	}
}

server {
	listen 0.0.0.0:9090;
	server_name second_server;
	root www;

	location / {
		allowed_methods GET;
		index second_index.html;
	}
}

server {
	listen 0.0.0.0:8080;
	server_name example.com;
	root www/example_site;

	location / {
		allowed_methods GET;
		index index.html;
	}
}
