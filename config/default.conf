root /www/html;
index default.html;
error_pages 500 /500.html;

server {
	listen 127.0.0.1:8080;
	server_name localhost;

	location / {
		index index.html; # This index is specific to this location
		autoindex on;
		allowed_methods GET POST DELETE;
	}
}

server {
	listen 8001;
	server_name api.example.com;
	
	# This server uses the http-level root (/var/www/default)
	# and the http-level error_page
	
	location /api {
		alias /var/www/html/;
		allowed_methods POST;
	}
}